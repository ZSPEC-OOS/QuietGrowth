# Self-host stack: one app image + Postgres. Bind to localhost; put TLS termination in front for anything public.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-quietgrowth}", POSTGRES_DB: quietgrowth }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 20 }

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile }
    command: ["node", "packages/database/dist/migrate-cli.js"]
    env_file: ../.env
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }

  app:
    build: { context: .., dockerfile: infra/Dockerfile }
    env_file: ../.env
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # Stand-in for Vercel Cron: calls the same /api/cron/tick endpoint every 15 minutes.
  cron:
    image: curlimages/curl:8.10.1
    env_file: ../.env
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do sleep 900; curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/tick >/dev/null || echo tick failed; done"]
    depends_on: [app]

volumes: { pgdata: {} }
